 g.fillStyle=`rgba(${ICE},${.4*na})`;for(const p of CP)g.fillRect(p[0]-1,p[1]-1,2,2);

 if(S.a0){const n=Math.min(ADDR.length,Math.floor((E-S.a0)/.07)),t=ADDR.slice(0,n);if(n>0){g.font=`800 11px ${MONO}`;const w=g.measureText(ADDR).width+20;rr(270-w/2,601,w,20,10);g.fillStyle='rgba(30,24,6,.95)';g.fill();g.strokeStyle=`rgba(${GLD},${n>=ADDR.length?1:.6})`;g.lineWidth=1.5;g.stroke();g.fillStyle='#ffe27a';g.textAlign='left';g.fillText(t,270-w/2+10,615);g.textAlign='center';

 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
