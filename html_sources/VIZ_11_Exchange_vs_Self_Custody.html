function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

 for(let c=0;c<12;c++){const x=22+c*43,sp=18+R(c,3,3)*30;for(let r=0;r<16;r++){const y=((r*62+E*sp+R(c,r,1)*300)%1000)-20;
  g.fillStyle=`rgba(130,150,255,${.04+.05*R(c,r,5)})`;g.fillText('0123456789abcdef'[Math.floor(R(c,r,2)*16+E*1.5)%16],x,y)}}}

 g.fillStyle='rgba(11,15,32,.92)';rr(x-78,Y0,156,Y1-Y0,14);g.fill();g.strokeStyle=`rgba(${L.rgb},${.5+.3*fl})`;g.lineWidth=1.6;g.stroke();
 const t=s==='L'?'EXCHANGE':'SELF-CUSTODY';g.font=`700 11px ${MONO}`;g.textAlign='center';const w=g.measureText(t).width;
 g.fillStyle=`rgba(${L.rgb},.95)`;g.fillText(t,x+8,Y0+20);g.strokeStyle=`rgba(${L.rgb},.95)`;g.lineWidth=1.6;g.beginPath();g.arc(x-w/2-4,Y0+16,5,0,7);g.stroke();
 g.beginPath();g.moveTo(x-w/2-6,Y0+16);g.lineTo(x-w/2-2,Y0+16);g.stroke();
 if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.18*fl*FA})`;rr(x-78,Y0,156,Y1-Y0,14);g.fill();g.globalCompositeOperation='source-over'}}
function drawTop(s){const rgb=LANE[s].rgb,h=LANE[s].h,x=CX[s];g.textAlign='center';g.font=`700 8.5px ${MONO}`;g.fillStyle='rgba(190,205,235,.8)';
 g.fillText('YOUR COINS · '+cnt(s),x,298);
 for(let k=0;k<24;k++){const p=ug(s,k),t=S.u[s][k];if(t!==0){const pop=ease((E-t)/.25);glow(p[0],p[1],10,h,.45*pop);g.fillStyle=`hsl(${h},95%,65%)`;g.beginPath();g.arc(p[0],p[1],3.8*pop,0,7);g.fill()}
  else{g.strokeStyle=`rgba(${rgb},.18)`;g.lineWidth=1;g.beginPath();g.arc(p[0],p[1],3.4,0,7);g.stroke()}}}
function drawL(){const x=CX.L,rgb=LANE.L.rgb,hol=S.hol&&E>S.hol,fh=S.hol?Math.exp(-(E-S.hol)*3):0,jit=S.hol&&E<S.hol+.8?Math.sin(E*70)*2*(1-(E-S.hol)/.8):0,vx=x+jit;
 g.fillStyle='rgba(20,24,42,.96)';rr(vx-62,398,124,106,10);g.fill();g.strokeStyle=hol?`rgba(255,110,90,${.6+.4*fh})`:`rgba(${rgb},.8)`;g.lineWidth=1.5;g.stroke();
 g.textAlign='center';g.font=`700 8px ${MONO}`;g.fillStyle='rgba(220,225,245,.8)';g.fillText('EXCHANGE VAULT',vx,411);
 for(let k=0;k<24;k++){const p=vc(k),px=p[0]+jit,v=S.v[k];
  if(v>0){if(hol&&k>=6){g.setLineDash([2,2]);g.strokeStyle='rgba(255,110,90,.85)';g.lineWidth=1.2;g.beginPath();g.arc(px,p[1],4.6,0,7);g.stroke();g.setLineDash([])}
   else{const pop=ease((E-v)/.25);glow(px,p[1],11,42,.5*pop);g.fillStyle='hsl(42,95%,64%)';g.beginPath();g.arc(px,p[1],4.6*pop,0,7);g.fill()}}
  else{g.strokeStyle='rgba(255,196,70,.14)';g.lineWidth=1;g.beginPath();g.arc(px,p[1],4.4,0,7);g.stroke()}}
 g.fillStyle=hol?'#ff7a6a':'rgba(255,196,70,.9)';g.font=`800 9px ${MONO}`;g.fillText(hol?'RESERVES 6/24 ✗':'RESERVES 24/24',vx,494);
 if(fh>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,80,60,${.22*fh})`;rr(vx-62,398,124,106,10);g.fill();g.globalCompositeOperation='source-over'}
 if(S.lock){const a=ease((E-S.lock)/.3),pl=.7+.3*Math.sin(E*8);g.globalAlpha=FA*a;g.fillStyle=`rgba(255,80,60,${.12+.1*pl})`;rr(x-62,522,124,36,8);g.fill();g.strokeStyle=`rgba(255,100,80,${.6+.4*pl})`;g.lineWidth=1.4;g.stroke();
  g.fillStyle='#ff8a7a';g.font=`800 9px ${MONO}`;g.fillText('⛔ WITHDRAWALS PAUSED',x,537);g.font=`700 8px ${MONO}`;g.fillText(S.rej+' USERS STUCK',x,550);g.globalAlpha=FA}}

 g.fillStyle='rgba(14,30,34,.9)';rr(x-66,396,132,118,10);g.fill();g.strokeStyle=`rgba(${rgb},${.6+.3*fl})`;g.lineWidth=1.5;g.stroke();
 g.textAlign='center';g.font=`700 8px ${MONO}`;g.fillStyle='rgba(220,235,245,.8)';g.fillText('YOUR KEYS · 24 WALLETS',x,409);
 for(let k=0;k<24;k++){const p=wc(k),w=S.w[k];
  if(w>0){const pop=ease((E-w)/.25);glow(p[0]+9,p[1]+8,12,150,.4*pop);g.fillStyle=`rgba(${rgb},${.16+.2*fl})`;rr(p[0],p[1],18,16,4);g.fill();g.strokeStyle=`rgba(${rgb},.9)`;g.lineWidth=1.2;g.stroke();
   g.fillStyle='hsl(150,95%,68%)';g.beginPath();g.arc(p[0]+9,p[1]+8,3.4*pop,0,7);g.fill()}
  else{g.strokeStyle='rgba(90,255,170,.14)';g.lineWidth=1;rr(p[0],p[1],18,16,4);g.stroke()}}
 g.fillStyle='rgba(90,255,170,.1)';rr(x-62,528,124,28,8);g.fill();g.strokeStyle='rgba(90,255,170,.55)';g.lineWidth=1.3;g.stroke();
 g.fillStyle='#b9ffdf';g.font=`800 8.5px ${MONO}`;g.fillText('🔑 NO ONE CAN PAUSE YOU',x,545)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 for(const p of S.pk.slice()){if(E-p.t0>=p.dur){S.pk.splice(S.pk.indexOf(p),1);p.fn()}}
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 rain();FA=ease((E-S.on)/.6)*(S.on>0?1:0);
 if(FA>0){g.globalAlpha=FA;panel('L');panel('R');drawTop('L');drawTop('R');drawL();drawR();g.globalAlpha=1}
 for(const s of['L','R']){const v=S.rec[s]+'/24',el=$('#n'+s);if(el.textContent!==v)el.textContent=v}
 g.globalCompositeOperation='lighter';
 for(const p of S.pk){const u=ease((E-p.t0)/p.dur),px=lerp(p.x0,p.x1,u),py=lerp(p.y0,p.y1,u);
  for(let k=4;k>=1;k--){const v=ease((E-p.t0)/p.dur-k*.05);glow(lerp(p.x0,p.x1,v),lerp(p.y0,p.y1,v),7+k,p.h,.08*(5-k))}
  glow(px,py,20,p.h,.8);g.fillStyle=`hsl(${p.h},95%,85%)`;g.beginPath();g.arc(px,py,3.6,0,7);g.fill()}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}
