<style>
/* REEL-VIZ FORMAT · 9:16 · 540x960 stage · safe zone: x 36-460, y 140-770 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--l1:#ff8a4c;--l2:#7cf3ff;--vio:#9b7bff;--txt:#eef0ff;--dim:#5f6a8a;
--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Space Grotesk',system-ui,-apple-system,sans-serif}
html,body{height:100%;background:#04050c;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#fit{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:540px;height:960px;transform-origin:center center;overflow:hidden;
background:radial-gradient(110% 60% at 50% -8%,#1a1440 0%,transparent 62%),radial-gradient(80% 50% at 110% 108%,#0b2a3a 0%,transparent 60%),radial-gradient(70% 45% at -10% 105%,#2c1408 0%,transparent 60%),#080a16}
.aur{position:absolute;width:430px;height:430px;border-radius:50%;filter:blur(80px);opacity:.17;pointer-events:none}
.a1{background:#7c4dff;top:-170px;left:-130px;animation:drift 16s ease-in-out infinite alternate}
.a2{background:#14d9ff;bottom:-150px;right:-130px;animation:drift 19s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(42px,30px) scale(1.12)}}
#grain{position:absolute;inset:0;z-index:40;opacity:.06;pointer-events:none;mix-blend-mode:overlay}
canvas#cv{position:absolute;inset:0;width:540px;height:960px;z-index:3;pointer-events:none}
.rev{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .65s cubic-bezier(.16,1,.3,1)}
.rev.show{opacity:1;transform:none}
#head{position:absolute;left:0;right:0;top:142px;text-align:center;z-index:6}
.kick{font:500 11px/1 var(--mono);letter-spacing:.26em;color:var(--dim)}
.title{margin-top:10px;font:700 38px/1.1 var(--sans);color:var(--txt);letter-spacing:-.01em}
.l1c{color:var(--l1);text-shadow:0 0 22px rgba(255,138,76,.45)}
.l2c{background:linear-gradient(90deg,#7cf3ff,#9b7bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(124,243,255,.4))}
.vs{color:#6d7596;font-weight:500;font-size:24px;margin:0 8px}

#rail i.on{color:#fff;border-color:var(--vio);background:rgba(155,123,255,.24);box-shadow:0 0 14px rgba(155,123,255,.55)}
#rail i.done{color:var(--l2);border-color:rgba(124,243,255,.4)}
.cnt{position:absolute;top:610px;width:150px;z-index:6;text-align:center}
#cL{left:62px}#cR{left:302px}
.cnt .num{font:700 28px/1 var(--sans);color:var(--txt)}
#nL{color:var(--l1)}#nR{color:var(--l2)}
.cnt .lab{margin-top:5px;font:700 9px/1 var(--mono);letter-spacing:.14em;color:#6d7596}
.cnt .st{margin-top:9px;display:inline-block;padding:4px 8px;border-radius:7px;font:700 9.5px/1 var(--mono);letter-spacing:.06em;opacity:0;transition:opacity .4s}
.cnt .st.show{opacity:1}
#stL{color:#ff7a6a;border:1.3px solid rgba(255,122,106,.6);background:rgba(255,122,106,.08)}
#stR{color:var(--l2);border:1.3px solid rgba(124,243,255,.6);background:rgba(124,243,255,.08)}
#punch{position:absolute;left:0;right:0;top:712px;text-align:center;z-index:6;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.3,.3,1)}
#punch.show{opacity:1;transform:none}

#fx{position:absolute;inset:0;z-index:8;pointer-events:none}

@keyframes flt{0%{opacity:0;margin-top:8px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-18px}}
#guide{position:absolute;inset:0;z-index:50;pointer-events:none;display:none;background:linear-gradient(rgba(255,40,90,.16) 0 140px,transparent 140px 770px,rgba(255,40,90,.16) 770px);box-shadow:inset -80px 0 0 rgba(255,40,90,.16),inset 36px 0 0 rgba(255,40,90,.16)}
.ui{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:99;display:flex;gap:4px;opacity:0;transition:opacity .4s}
body.show .ui,.ui.keep{opacity:1}
.ui button{background:#1b1d33;color:#cfd4ea;border:1px solid #333a62;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.aur{animation:none}}

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),stage=$('#stage'),fx=$('#fx'),cv=$('#cv'),g=cv.getContext('2d');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,ease=x=>1-Math.pow(1-clamp(x,0,1),3);
const R=(a,b,c)=>{const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x)};
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,784,880,1046.5,1174.66];
const QS=new URLSearchParams(location.search);
let sc=1;function fit(){sc=Math.min(innerWidth/540,innerHeight/960);stage.style.transform=`scale(${sc})`}
addEventListener('resize',fit);fit();

/* ================= AUDIO: 100% synthesized ================= */
let ac=null,master,sfxBus,musBus,rev,muted=false,musicOn=QS.get('music')!=='0',A0=0,start=0,playing=false;
function audioInit(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 ac=new AC();master=ac.createGain();master.gain.value=.62;
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=6;master.connect(comp);comp.connect(ac.destination);
 sfxBus=ac.createGain();sfxBus.connect(master);
 rev=ac.createConvolver();const n=ac.sampleRate*1.7|0,b=ac.createBuffer(2,n,ac.sampleRate);
 for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
 rev.buffer=b;const rg=ac.createGain();rg.gain.value=.3;rev.connect(rg);rg.connect(master);newBus()}
function newBus(){if(musBus)musBus.gain.setTargetAtTime(0,ac.currentTime,.05);musBus=ac.createGain();musBus.gain.value=.7;
 musBus.connect(master);const s=ac.createGain();s.gain.value=.35;musBus.connect(s);s.connect(rev)}
const TN=()=>ac?Math.max(ac.currentTime,A0+(performance.now()-start)/1000):0;
function out(node,o){const p=ac.createStereoPanner?ac.createStereoPanner():null;if(p){p.pan.value=o.pan||0;node.connect(p);node=p}
 node.connect(o.bus||sfxBus);if(o.wet!==0){const w=ac.createGain();w.gain.value=o.wet==null?.25:o.wet;node.connect(w);w.connect(rev)}}
function tone(o={}){if(!ac||muted)return;const{type='sine',f=440,f2=null,dur=.12,vol=.15,at=0,atk=.008}=o,t0=o.abs!=null?o.abs:TN()+at;
 const osc=ac.createOscillator();osc.type=type;osc.frequency.setValueAtTime(f,t0);if(f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+atk);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}
function noise(o={}){if(!ac||muted)return;const{dur:d0=.4,vol=.2,at=0,f0=400,f1=2000,q=1.2,ft='bandpass'}=o,dur=d0,t0=o.abs!=null?o.abs:TN()+at;
 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+dur*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 n.connect(f);f.connect(gn);out(gn,o);n.start(t0);n.stop(t0+dur+.05)}
const sfx={
 ui(){tone({f:640,dur:.05,vol:.05,wet:.1})},
 thump(){tone({f:130,f2:38,dur:.45,vol:.6,wet:.1});tone({type:'triangle',f:520,f2:70,dur:.12,vol:.1})},
 zap(){tone({type:'sawtooth',f:2100,f2:160,dur:.2,vol:.14});noise({dur:.14,vol:.05,f0:3000,f1:600})},
 whoosh(d=.5,v=.12,rv=false){noise({dur:d,vol:v,f0:rv?2600:300,f1:rv?350:2600})},
 chord(v=.07){[261.6,329.6,392,523.2,659.3].forEach((f,i)=>tone({type:'triangle',f,dur:1.5,vol:v,at:i*.035,wet:.4}));tone({f:130,f2:60,dur:.6,vol:.28,wet:.1})},
 impact(){tone({f:90,f2:28,dur:.9,vol:.7,wet:.1});noise({dur:.7,vol:.18,f0:2500,f1:80,q:.6});sfx.chord(.08)},
 alarm(){for(let i=0;i<4;i++)tone({type:'square',f:i%2?520:390,dur:.14,vol:.07,at:i*.2,pan:-.5,wet:.1});noise({dur:.5,vol:.1,f0:2500,f1:200,pan:-.5})},
 tickL(k){tone({type:'triangle',f:NOTES[k%6]*.5,dur:.12,vol:.05,pan:-.5})},
 tickR(k){tone({f:NOTES[k%10]*2,dur:.09,vol:.05,pan:.5,wet:.3})},
 seal(k){tone({f:190,f2:70,dur:.2,vol:.12,pan:-.5,wet:.1});tone({type:'triangle',f:NOTES[k%8]*2,dur:.25,vol:.06,pan:-.5})},
 compress(){noise({dur:.8,vol:.12,f0:6000,f1:300,pan:.5});tone({type:'sawtooth',f:200,f2:1800,dur:.8,vol:.05,pan:.5})},
 land(){tone({type:'triangle',f:523,dur:.4,vol:.09,pan:.5,wet:.4});tone({type:'triangle',f:784,dur:.5,vol:.08,at:.08,pan:.5,wet:.4});tone({type:'triangle',f:1046,dur:.6,vol:.07,at:.16,pan:.5,wet:.4});sfx.zap()}
};
/* generative music bed on the audio clock (A minor, 120 bpm) */
function music(){if(!ac||!musicOn)return;const t0=A0,B=.5;
 const CH=[[220,261.6,329.6,110],[174.6,220,261.6,87.3],[261.6,329.6,392,130.8],[196,246.9,293.7,98]];
 CH.forEach((c,i)=>{const t=t0+i*4;
  c.slice(0,3).forEach(f=>[-7,7].forEach(d=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;
   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+3);
   const gn=ac.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.013,t+1.2);gn.gain.linearRampToValueAtTime(.0001,t+4.3);
   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));
  for(let b=0;b<2;b++)tone({abs:t+b*2,f:c[3],dur:1.9,vol:.1,atk:.04,bus:musBus,wet:0})});
 const AR=[440,523.25,659.25,784,659.25,523.25,440,392];
 for(let i=0;i<40;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20,0,1);if(t>t0+11.6)break;
  tone({abs:t,type:'triangle',f:AR[i%8]*(i%16>=8?2:1),dur:.3,vol:v,bus:musBus,pan:Math.sin(i)*.4,wet:.35})}
 for(let b=0;b<17;b++){const t=t0+3+b*B;tone({abs:t,f:135,f2:42,dur:.22,vol:.2,bus:musBus,wet:0});
  noise({abs:t+B/2,dur:.05,vol:.018,f0:9000,f1:7000,q:.8,ft:'highpass',bus:musBus,wet:0})}
 noise({abs:t0+11.7,dur:.85,vol:.16,f0:300,f1:7000,q:1.5,bus:musBus});
 tone({abs:t0+11.7,type:'sawtooth',f:200,f2:1600,dur:.85,vol:.04,bus:musBus})}

/* ================= scene ================= */
const CX={L:137,R:377},LANE={L:{rgb:'255,138,76',h:24},R:{rgb:'124,243,255',h:185}},Y0=270,Y1=600;
const FEES=[9,11,13,16,19,22,26,28],TB=4.4,BD=.95,MONO='"JetBrains Mono",ui-monospace,monospace';
const mp=k=>[CX.L-52.5+(k%8)*15,310+Math.floor(k/8)*15];
const cell=k=>[CX.R-64+(k%6)*22+9,316+Math.floor(k/6)*16+6];
const slot=k=>[CX.L-69+(k%4)*36,450+Math.floor(k/4)*42];
const SPR={};function spr(h){const k=Math.round(h/10)*10;if(!SPR[k]){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}
function glow(x,y,r,h,a){if(a<.01)return;g.globalAlpha=Math.min(1,a);g.drawImage(spr(h),x-r,y-r,2*r,2*r);g.globalAlpha=1}
let S,E=0,events=[],raf=null,lastF=0,FA=0;
function fresh(){S={on:0,pend:[],cells:[],blk:null,chain:[],gas:18,gasT:18,fee:{L:0,R:0},feeT:{L:0,R:0},comp:0,post:0,fin:0,seal:-9,arrived:0,taken:0,pk:[],sp:[],rg:[],flash:{L:-9,R:-9}}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}
function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
function ring(x,y,h){S.rg.push({x,y,h,t:E})}
function burst(x,y,h,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=30+Math.random()*100;S.sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.4,t:E,h:h+Math.random()*30-15})}}
function ph(i){document.querySelectorAll('#rail i').forEach((n,k)=>{n.className=k<i?'done':k===i?'on':''})}
function tx(s,k){const t=s==='L'?mp(k):cell(k);
 S.pk.push({x0:CX[s]+(R(k,1,2)-.5)*60,y0:Y0+8,x1:t[0],y1:t[1],t0:E,dur:.45,h:LANE[s].h+(k%3)*8,
  fn:()=>{if(s==='L'){S.pend[k]=E;S.arrived++;sfx.tickL(k)}else{S.cells[k]=E;sfx.tickR(k)}}})}
function block(k){S.blk={k,t0:E};S.gasT=30+k*10;
 for(let i=0;i<3;i++){const id=k*3+i,p=mp(id);S.pend[id]=-1;S.taken++;S.pk.push({x0:p[0],y0:p[1],x1:CX.L+(i-1)*22,y1:407,t0:E+i*.05,dur:.3,h:28,fn:()=>{}})}
 at(E+.45,()=>{sfx.seal(k);S.seal=E;S.chain[k]=E;ring(CX.L,407,24)});
 at(E+.95,()=>{S.feeT.L+=FEES[k];const p=slot(k);ring(p[0]+15,p[1]+15,24);flt('-$'+FEES[k]+' gas',CX.L,330,'#ff8a4c')})}
function buildTimeline(){const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.5,.1);ring(CX.L,Y0+16,24);ring(CX.R,Y0+16,185);$('#rail').classList.add('show')});
 a(2.6,()=>{$('#cL').classList.add('show');$('#cR').classList.add('show');sfx.chord(.035)});
 a(3.0,()=>{ph(0);flt('24 swaps hit the network',270,300,'#eef0ff')});
 for(let k=0;k<24;k++)a(3.2+k*.12,()=>{tx('L',k);tx('R',k)});
 a(4.0,()=>{flt('bidding for gas…',CX.L,340,'#ff8a4c');flt('batched off-chain',CX.R,400,'#7cf3ff')});
 a(TB-.1,()=>ph(1));
 for(let k=0;k<8;k++)a(TB+k*BD,()=>block(k));
 a(7.0,()=>{ph(2);S.comp=E;sfx.compress();flt('compress 24 → 1',CX.R,400,'#9b7bff')});
 a(7.9,()=>{S.post=E;sfx.whoosh(.6,.1)});
 a(8.5,()=>{S.fin=E;S.feeT.R=12;S.flash.R=E;sfx.land();ring(CX.R,560,185);burst(CX.R,560,185,18);flt('1 tx on L1 · $12',CX.R,500,'#7cf3ff')});
 a(8.2,()=>flt('still queuing…',CX.L,340,'#ff8a4c'));
 a(9.0,()=>{$('#stR').classList.add('show');sfx.chord(.05)});
 a(11.2,()=>{ph(3);flt('block 8/8 sealed',CX.L,340,'#ff8a4c')});
 a(11.6,()=>{$('#stL').classList.add('show');S.flash.L=E;sfx.alarm()});
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash.L=S.flash.R=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');
 $('#stL').classList.remove('show');$('#stR').classList.remove('show');$('#nL').textContent='$0';$('#nR').textContent='$0';ph(-1);fx.innerHTML=''}
function startPlay(){fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function eth(x,y,s,rgb){g.fillStyle=`rgba(${rgb},.95)`;g.beginPath();g.moveTo(x,y-s);g.lineTo(x+s*.62,y+s*.05);g.lineTo(x,y+s*.3);g.lineTo(x-s*.62,y+s*.05);g.closePath();g.fill();
 g.fillStyle=`rgba(${rgb},.6)`;g.beginPath();g.moveTo(x,y+s*.5);g.lineTo(x+s*.62,y+s*.18);g.lineTo(x,y+s);g.lineTo(x-s*.62,y+s*.18);g.closePath();g.fill()}
function rain(){g.font=`700 9px ${MONO}`;g.textAlign='center';
 for(let c=0;c<12;c++){const x=22+c*43,sp=18+R(c,3,3)*30;for(let r=0;r<16;r++){const y=((r*62+E*sp+R(c,r,1)*300)%1000)-20;
  g.fillStyle=`rgba(130,150,255,${.04+.05*R(c,r,5)})`;g.fillText('0123456789abcdef'[Math.floor(R(c,r,2)*16+E*1.5)%16],x,y)}}}
function panel(s){const x=CX[s],L=LANE[s],fl=Math.exp(-(E-S.flash[s])*3);
 g.fillStyle='rgba(11,15,32,.92)';rr(x-78,Y0,156,Y1-Y0,14);g.fill();g.strokeStyle=`rgba(${L.rgb},${.5+.3*fl})`;g.lineWidth=1.6;g.stroke();
 const t=s==='L'?'ETHEREUM L1':'ROLLUP L2';g.font=`700 11px ${MONO}`;g.textAlign='center';const w=g.measureText(t).width;
 g.fillStyle=`rgba(${L.rgb},.95)`;g.fillText(t,x+8,Y0+20);eth(x-w/2-4,Y0+16,7,L.rgb);
 if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.2*fl*FA})`;rr(x-78,Y0,156,Y1-Y0,14);g.fill();g.globalCompositeOperation='source-over'}}
function drawL(dt){const x=CX.L,rgb=LANE.L.rgb,fs=Math.exp(-(E-S.seal)*5);g.textAlign='center';
 g.font=`700 8.5px ${MONO}`;g.fillStyle='rgba(190,205,235,.8)';g.fillText('MEMPOOL · '+Math.max(0,S.arrived-S.taken)+' PENDING',x,298);
 for(let k=0;k<24;k++){const t=S.pend[k];if(t>0){const p=mp(k),pop=ease((E-t)/.25);glow(p[0],p[1],10,24+(k%3)*8,.5*pop);g.fillStyle=`hsl(${28+(k%3)*8},95%,68%)`;g.beginPath();g.arc(p[0],p[1],3.6*pop,0,7);g.fill()}}
 S.gas+=(S.gasT-S.gas)*Math.min(1,dt*3);const hue=lerp(38,0,clamp((S.gas-18)/90,0,1));
 g.fillStyle=`hsl(${hue},95%,65%)`;g.font=`800 10px ${MONO}`;g.fillText('⛽ GAS '+Math.round(S.gas)+' gwei',x,366);
 g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x-55,372,110,4);g.fillStyle=`hsl(${hue},95%,60%)`;g.fillRect(x-55,372,110*clamp(S.gas/110,.05,1),4);
 const b=S.blk,n=b?Math.min(8,b.k+(E>b.t0+.5?2:1)):1;
 g.fillStyle='rgba(20,26,50,.95)';rr(x-55,386,110,42,8);g.fill();g.strokeStyle=`rgba(${rgb},${.55+.4*fs})`;g.lineWidth=1.4;g.stroke();
 g.fillStyle='rgba(200,215,240,.75)';g.font=`700 8px ${MONO}`;g.fillText('BLOCK '+n+'/8 · MAX 3 TX',x,398);
 for(let i=0;i<3;i++){const on=b&&E<b.t0+.5&&E>=b.t0+.05*i+.3,px=x-22+i*22;g.fillStyle=on?'hsl(28,95%,66%)':'rgba(255,255,255,.1)';g.beginPath();g.arc(px,414,5,0,7);g.fill();if(on)glow(px,414,14,28,.6)}
 let done=0;
 for(let k=0;k<8;k++){const c=S.chain[k];if(c===undefined)continue;const p=slot(k),u=ease((E-c)/.5),px=lerp(x-15,p[0],u),py=lerp(393,p[1],u),fe=u>=1?Math.exp(-(E-c-.5)*3):.3;if(u>=1)done++;
  if(u>=1&&k%4>0){g.strokeStyle=`rgba(${rgb},.6)`;g.lineWidth=1.2;g.beginPath();g.moveTo(px-6,py+15);g.lineTo(px,py+15);g.stroke()}
  g.fillStyle=`rgba(${rgb},${.18+.3*fe})`;rr(px,py,30,30,6);g.fill();g.strokeStyle=`rgba(${rgb},.9)`;g.lineWidth=1.3;g.stroke();
  for(let i=0;i<3;i++){g.fillStyle='rgba(255,230,200,.9)';g.beginPath();g.arc(px+7+i*8,py+15,2,0,7);g.fill()}}
 g.font=`700 8.5px ${MONO}`;g.fillStyle='rgba(190,205,235,.8)';g.fillText(done+' BLOCKS · '+done*3+' TXS FINAL',x,556)}
function drawR(){const x=CX.R,rgb=LANE.R.rgb;g.textAlign='center';
 const filled=S.cells.filter(t=>t>0).length,cp=S.comp?clamp((E-S.comp)/.8,0,1):0,e=ease(cp);
 g.font=`700 8.5px ${MONO}`;g.fillStyle='rgba(190,205,235,.8)';g.fillText('SEQUENCER · '+filled+'/24',x,298);
 if(cp<1)for(let k=0;k<24;k++){const c=cell(k),t=S.cells[k],px=lerp(c[0],x,e),py=lerp(c[1],430,e),w=18*(1-e*.55),h=12*(1-e*.55);
  if(t>0){const pop=ease((E-t)/.2);glow(px,py,14,185,.45*pop*(1-e));g.fillStyle=`rgba(${rgb},${.35+.55*pop})`;g.fillRect(px-w/2,py-h/2,w,h)}
  else{g.strokeStyle='rgba(124,243,255,.16)';g.lineWidth=1;g.strokeRect(px-9,py-6,18,12)}}
 if(cp<1){g.font=`700 7.5px ${MONO}`;g.fillStyle='rgba(124,243,255,.55)';g.fillText('ORDERED + COMPRESSED OFF-CHAIN',x,396)}
 if(S.comp&&E>S.comp+.5){g.setLineDash([2,6]);g.lineDashOffset=-E*30;g.strokeStyle='rgba(124,243,255,.5)';g.lineWidth=1.4;g.beginPath();g.moveTo(x,456);g.lineTo(x,542);g.stroke();g.setLineDash([])}
 const fe=S.fin?Math.exp(-(E-S.fin)*3):0;
 g.fillStyle=`rgba(155,123,255,${.14+.3*fe})`;rr(x-65,546,130,28,8);g.fill();g.strokeStyle=`rgba(155,123,255,${.6+.4*fe})`;g.lineWidth=1.4;g.stroke();
 g.font=`700 9px ${MONO}`;g.fillStyle='#e3dcff';g.fillText(S.fin&&E>S.fin?'ETHEREUM L1 · 1 TX ✓':'ETHEREUM L1',x+8,564);eth(x-(S.fin&&E>S.fin?56:39),560,6,'200,185,255');
 if(cp>=1){const pp=S.post?clamp((E-S.post)/.6,0,1):0,u=ease(pp),ba=ease((E-S.comp-.75)/.3),y=lerp(430,556,u),w=lerp(112,34,u),h=lerp(46,18,u),al=ba*(1-clamp((pp-.8)/.2));
  g.globalAlpha=al;glow(x,y,70*(1-u*.5),185,.5+.2*Math.sin(E*6));g.fillStyle='rgba(124,243,255,.22)';rr(x-w/2,y-h/2,w,h,8);g.fill();g.strokeStyle='rgba(124,243,255,.95)';g.lineWidth=1.6;g.stroke();
  if(u<.4){g.globalAlpha=al*(1-u*2.5);g.fillStyle='#fff';g.font=`800 10px ${MONO}`;g.fillText('BATCH ×24',x,y-2);g.fillStyle='#9ff6ff';g.font=`700 8px ${MONO}`;g.fillText('ZK PROOF ✓',x,y+11)}
  g.globalAlpha=1}}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 for(const p of S.pk.slice()){if(E-p.t0>=p.dur){S.pk.splice(S.pk.indexOf(p),1);p.fn()}}
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 rain();FA=ease((E-S.on)/.6)*(S.on>0?1:0);
 if(FA>0){g.globalAlpha=FA;panel('L');panel('R');drawL(dt);drawR();g.globalAlpha=1}
 for(const s of['L','R']){S.fee[s]+=(S.feeT[s]-S.fee[s])*Math.min(1,dt*5);const v='$'+Math.round(S.fee[s]),el=$('#n'+s);if(el.textContent!==v)el.textContent=v}
 g.globalCompositeOperation='lighter';
 for(const p of S.pk){const u=ease((E-p.t0)/p.dur);if(E<p.t0)continue;const px=lerp(p.x0,p.x1,u),py=lerp(p.y0,p.y1,u);
  for(let k=4;k>=1;k--){const v=ease((E-p.t0)/p.dur-k*.05);glow(lerp(p.x0,p.x1,v),lerp(p.y0,p.y1,v),7+k,p.h,.08*(5-k))}
  glow(px,py,20,p.h,.8);g.fillStyle=`hsl(${p.h},95%,85%)`;g.beginPath();g.arc(px,py,3.6,0,7);g.fill()}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}

(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});

addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);
})();
