function drawChart(na){const x=curx(),y=yOf(x),P=[X(x),Y(y)];
 g.lineWidth=1;g.font=`700 8px ${MONO}`;
 for(let i=0;i<=4;i++){const gx=L+i*W/4;g.strokeStyle=`rgba(190,170,255,${(i?.09:.35)*na})`;g.beginPath();g.moveTo(gx,T);g.lineTo(gx,BT);g.stroke();if(i){g.fillStyle=`rgba(190,180,230,${.6*na})`;g.textAlign='center';g.fillText(i*400,gx,BT+12)}}
 for(let j=0;j<=5;j++){const gy=BT-j*H/5;g.strokeStyle=`rgba(190,170,255,${(j?.09:.35)*na})`;g.beginPath();g.moveTo(L,gy);g.lineTo(RT,gy);g.stroke();if(j){g.fillStyle=`rgba(190,180,230,${.6*na})`;g.textAlign='right';g.fillText(j+'M',L-6,gy+3)}}
 g.fillStyle=`rgba(255,170,215,${.85*na})`;g.font=`700 8.5px ${MONO}`;g.textAlign='left';g.fillText('USDC IN POOL ↑',L+6,T+11);g.textAlign='right';g.fillText('ETH IN POOL →',RT-6,BT-7);
 const ta=S.tan?ease((E-S.tan)/.5):0;
 if(ta>0){g.setLineDash([5,5]);g.lineDashOffset=-E*12;g.strokeStyle=`rgba(${MINT},${.6*ta})`;g.lineWidth=1.3;g.beginPath();g.moveTo(L,BT);g.lineTo(RT,Y(2000*XM));g.stroke();g.setLineDash([]);g.fillStyle=`rgba(${MINT},${ta})`;g.font=`700 8.5px ${MONO}`;g.textAlign='right';g.fillText('MARKET $2,000',RT-4,Y(2000*XM)-8)}
 const xc=lerp(XM,400,ease((E-S.on)/1.4)),gr=g.createLinearGradient(X(400),Y(5e6),X(1600),Y(1.25e6));gr.addColorStop(0,'#8f6bff');gr.addColorStop(1,'#ff4fa3');
 g.beginPath();for(let v=XM;v>=xc;v-=8)g[v===XM?'moveTo':'lineTo'](X(v),Y(yOf(v)));
 g.strokeStyle=gr;g.lineJoin='round';g.globalAlpha=.25;g.lineWidth=10;g.stroke();g.globalAlpha=1;g.lineWidth=2.6;g.stroke();
 const ra=S.rt?ease((E-S.rt)/.6):0;
 if(ra>0){g.fillStyle=`rgba(${PK},${.12*ra})`;g.fillRect(L,P[1],P[0]-L,BT-P[1]);g.setLineDash([4,4]);g.strokeStyle=`rgba(${PK},${.7*ra})`;g.lineWidth=1.2;g.strokeRect(L,P[1],P[0]-L,BT-P[1]);g.setLineDash([]);
  g.fillStyle=`rgba(255,225,240,${.9*ra})`;g.font=`800 11px ${MONO}`;g.textAlign='center';g.fillText('x · y = k',(L+P[0])/2,(P[1]+BT)/2+3)}
 if(S.tr&&Math.abs(x-S.tr.xa)>1){const xa=S.tr.xa,A=[X(xa),Y(yOf(xa))],avg=Math.abs(yOf(x)-yOf(xa))/Math.abs(x-xa);S.avg=avg;
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=3.2;g.globalAlpha=.9;g.beginPath();for(let v=xa,st=(x-xa)/24,k=0;k<=24;k++,v+=st)g[k?'lineTo':'moveTo'](X(v),Y(yOf(v)));g.stroke();g.globalAlpha=1;
  g.setLineDash([4,4]);g.lineDashOffset=-E*14;g.strokeStyle=`rgb(${MINT})`;g.lineWidth=1.6;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(P[0],P[1]);g.stroke();g.setLineDash([]);
  if(Math.abs(x-S.tr.xa)>12){const buy=x<xa,pc=buy?avg/(yOf(xa)/xa)-1:0,mx=(A[0]+P[0])/2+(buy?-8:8),my=(A[1]+P[1])/2-(buy?10:-14);
   pill((buy?'PAID $':'SOLD $')+fmt(avg)+(buy&&pc>.05?' · +'+Math.round(pc*100)+'%':''),clamp(mx,110,420),my,buy&&pc>.05?'#ff6a6a':`rgb(${MINT})`)}}
 if(ta>0){const s=(y/x)*(H/YM)*(XM/W),d=52/Math.sqrt(1+s*s);g.strokeStyle=`rgba(255,211,77,${ta})`;g.lineWidth=2;g.beginPath();g.moveTo(P[0]-d,P[1]-s*d);g.lineTo(P[0]+d,P[1]+s*d);g.stroke();
  g.fillStyle=`rgba(255,211,77,${ta})`;g.font=`700 8.5px ${MONO}`;g.textAlign='left';g.fillText('SPOT $'+fmt(y/x),P[0]+d+4,P[1]+s*d+3)}
 const pa=S.pt?ease((E-S.pt)/.4):0,fl=Math.exp(-(E-S.flash)*3);
 if(pa>0){glow(P[0],P[1],34,330,(.8+.2*fl)*pa);g.fillStyle='#ffe8f4';g.beginPath();g.arc(P[0],P[1],5.5*pa,0,7);g.fill()}
 const bars=[['ETH '+fmt(x),x/XM,'143,107,255',604],['USDC '+(y/1e6).toFixed(2)+'M',y/YM,PK,620]];g.font=`700 8.5px ${MONO}`;
 bars.forEach(([t,f,c,by])=>{g.textAlign='left';g.fillStyle=`rgba(210,200,240,${.85*na})`;g.fillText(t,L,by+7);g.fillStyle=`rgba(255,255,255,${.07*na})`;rr(L+66,by,W-66,8,4);g.fill();g.fillStyle=`rgba(${c},${.85*na})`;rr(L+66,by,Math.max(6,f*(W-66)),8,4);g.fill()})}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 rain();if(S.on)drawChart(ease((E-S.on)/.8));
 const x=curx(),y=yOf(x),a=[S.pt?'$'+fmt(y/x):'—',S.avg?'$'+fmt(S.avg):'—',S.pt?(x*y/1e9).toFixed(2)+'B':'—'];
 ['sl','sp','sb'].forEach((id,i)=>{const el=$('#'+id);if(el.textContent!==a[i])el.textContent=a[i]});
 g.globalCompositeOperation='lighter';
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const al=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,al)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const al=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-al})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+al*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}
