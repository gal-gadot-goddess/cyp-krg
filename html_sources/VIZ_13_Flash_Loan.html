   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));

 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}

 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function hex(x,y,r,rot=0){g.beginPath();for(let i=0;i<6;i++){const a=rot+i*Math.PI/3;g[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()}
function rain(){g.font=`700 9px ${MONO}`;g.textAlign='center';
 for(let c=0;c<12;c++){const x=22+c*43,sp=18+R(c,3,3)*30;for(let r=0;r<16;r++){const y=((r*62+E*sp+R(c,r,1)*300)%1000)-20;
  g.fillStyle=`rgba(140,170,255,${.04+.05*R(c,r,5)})`;g.fillText('0123456789abcdef'[Math.floor(R(c,r,2)*16+E*1.5)%16],x,y)}}}
const fm=v=>v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+Math.round(v/1e3)+'k';
function drawRing(na){const pc=S.seal?MINT:S.bad?'255,90,90':CY;
 g.setLineDash(S.seal?[]:[3,8]);g.lineDashOffset=-E*10;g.strokeStyle=`rgba(${pc},${(S.seal?.7:.22)*na})`;g.lineWidth=1.2;g.beginPath();g.arc(NC[0],NC[1],ROUT,0,7);g.stroke();g.setLineDash([]);
 for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=ROUT+(i%5?9:13);g.strokeStyle=`rgba(${CY},${.16*na})`;g.lineWidth=1;g.beginPath();g.moveTo(NC[0]+Math.cos(a)*(ROUT+6),NC[1]+Math.sin(a)*(ROUT+6));g.lineTo(NC[0]+Math.cos(a)*r1,NC[1]+Math.sin(a)*r1);g.stroke()}
 g.strokeStyle=`rgba(160,190,255,${.07*na})`;g.lineWidth=14;g.beginPath();g.arc(NC[0],NC[1],RR,0,7);g.stroke();
 [-7,7].forEach(o=>{g.strokeStyle=`rgba(160,190,255,${.2*na})`;g.lineWidth=1;g.beginPath();g.arc(NC[0],NC[1],RR+o,0,7);g.stroke()});
 if(S.ca>-89){g.lineCap='round';g.strokeStyle=`rgba(${pc},.22)`;g.lineWidth=11;g.beginPath();g.arc(NC[0],NC[1],RR,ang(-90),ang(S.ca));g.stroke();
  g.strokeStyle=`rgba(${pc},.95)`;g.lineWidth=3;g.beginPath();g.arc(NC[0],NC[1],RR,ang(-90),ang(S.ca));g.stroke();g.lineCap='butt'}}
function drawStations(na){g.globalAlpha=na;g.textAlign='center';
 /* liquidity pool */
 const P=PT(-90),lv=clamp(S.poolD/50,0,1.02);g.save();g.beginPath();g.arc(P[0],P[1],30,0,7);g.fillStyle='rgba(12,18,40,.95)';g.fill();g.clip();
 g.fillStyle=`rgba(${CY},.38)`;g.fillRect(P[0]-30,P[1]+30-60*lv,60,60*lv);g.fillStyle=`rgba(${CY},.7)`;g.fillRect(P[0]-30,P[1]+30-60*lv,60,2);g.restore();
 g.strokeStyle=`rgba(${CY},.9)`;g.lineWidth=1.6;g.beginPath();g.arc(P[0],P[1],30,0,7);g.stroke();
 g.fillStyle='#e6fbff';g.font=`800 10px ${MONO}`;g.fillText('POOL',P[0],P[1]+3);g.fillStyle='rgba(190,215,245,.85)';g.font=`700 8.5px ${MONO}`;g.fillText('$'+S.poolD.toFixed(1)+'M',P[0],P[1]+47);
 /* dexes */
 [['DEX A',0,'A'],['DEX B',90,'B']].forEach(([t,a,k])=>{const p=PT(a),f=Math.exp(-(E-(k==='B'?S.pf:-9))*3);
  hex(p[0],p[1],29,Math.PI/6);g.fillStyle='rgba(30,12,44,.95)';g.fill();g.strokeStyle=`rgba(255,79,216,${.7+.3*f})`;g.lineWidth=1.6;g.stroke();
  g.fillStyle='#ffd6f6';g.font=`800 10px ${MONO}`;g.fillText(t,p[0],p[1]+3);
  const up=k==='B'&&S.price.B>1,py=a===0?p[1]+42:p[1]+42;rr(p[0]-34,py,68,16,8);g.fillStyle=up?`rgba(125,255,154,${.16+.3*f})`:'rgba(255,255,255,.07)';g.fill();g.strokeStyle=up?`rgba(${MINT},.9)`:'rgba(255,255,255,.25)';g.lineWidth=1;g.stroke();
  g.fillStyle=up?'#b9ffc9':'#b8c0e0';g.font=`700 8.5px ${MONO}`;g.fillText('TKN $'+S.price[k].toFixed(2),p[0],py+11.5)});
 /* your wallet */
 const fl=Math.exp(-(E-S.flash)*3);g.beginPath();g.arc(NC[0],NC[1],28,0,7);g.fillStyle='rgba(10,24,24,.95)';g.fill();g.strokeStyle=`rgba(${MINT},${.45+.4*fl+(S.profit>0?.2:0)})`;g.lineWidth=1.6;g.stroke();
 g.fillStyle='#d6ffe0';g.font=`800 10px ${MONO}`;g.fillText('YOU',NC[0],NC[1]-1);if(S.profit>1){g.fillStyle='#7dff9a';g.font=`700 9px ${MONO}`;g.fillText('+'+fm(S.profit),NC[0],NC[1]+12)}
 g.globalAlpha=1;
 if(E-S.fail<1.2&&S.fail>0){const a=1-(E-S.fail)/1.2;g.strokeStyle=`rgba(255,90,90,${a})`;g.lineWidth=1.6;
  for(let i=0;i<7;i++){let x=P[0],y=P[1],ag=i*.9+.3;g.beginPath();g.moveTo(x,y);for(let k=0;k<3;k++){ag+=(R(i,k,7)-.5)*.9;x+=Math.cos(ag)*18;y+=Math.sin(ag)*18;g.lineTo(x,y)}g.stroke()}}}
function drawComet(){let s=null;for(const q of S.seg)if(E>=q.t0&&E<=q.t1){s=q;break}if(!s)return;
 const u=clamp((E-s.t0)/(s.t1-s.t0),0,1),sm=u*u*(3-2*u),a=lerp(s.a0,s.a1,sm),dir=Math.sign(s.a1-s.a0)||1,p=PT(a);S.ca=a;
 g.globalCompositeOperation='lighter';
 if(s.a0!==s.a1)for(let k=1;k<=12;k++){const q=PT(a-dir*k*4);glow(q[0],q[1],9+(12-k)*.6,s.h,.55*(1-k/13))}
 glow(p[0],p[1],26,s.h,.95);g.globalCompositeOperation='source-over';g.fillStyle=`hsl(${s.h},95%,88%)`;g.beginPath();g.arc(p[0],p[1],5.5,0,7);g.fill();
 const aa=((a%360)+360)%360,off=aa>45&&aa<135?-36:32,l=PT(a,RR+off);g.font=`700 9px ${MONO}`;g.textAlign='center';const w=g.measureText(s.lab).width+14;
 rr(l[0]-w/2,l[1]-8,w,16,8);g.fillStyle='rgba(8,12,28,.88)';g.fill();g.strokeStyle=`hsl(${s.h},95%,65%)`;g.lineWidth=1.2;g.stroke();g.fillStyle=`hsl(${s.h},95%,88%)`;g.fillText(s.lab,l[0],l[1]+3)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 for(const p of S.pk.slice()){if(E-p.t0>=p.dur){S.pk.splice(S.pk.indexOf(p),1);p.fn()}}
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 if(S.fail>0&&E-S.fail<.5)g.translate((Math.random()-.5)*5,(Math.random()-.5)*5);
 rain();
 if(S.on){const na=ease((E-S.on)/.8);drawRing(na);drawStations(na);drawComet()}
 const k=Math.min(1,dt*6);S.loan+=(S.loanT-S.loan)*k;S.profit+=(S.profitT-S.profit)*k;S.poolD+=(S.poolT-S.poolD)*Math.min(1,dt*5);
 const l=$('#sl'),pv=$('#sp'),a1=S.loan>1?fm(S.loan):'$0',a2=S.profit>1?'+'+fm(S.profit):'$0';
 if(l.textContent!==a1)l.textContent=a1;if(pv.textContent!==a2)pv.textContent=a2;l.className=S.bad?'bad':'';
 g.globalCompositeOperation='lighter';
 for(const p of S.pk){const u=ease((E-p.t0)/p.dur),px=lerp(p.x0,p.x1,u),py=lerp(p.y0,p.y1,u);
  for(let j=4;j>=1;j--){const w=ease((E-p.t0)/p.dur-j*.05);glow(lerp(p.x0,p.x1,w),lerp(p.y0,p.y1,w),7+j,p.h,.08*(5-j))}
  glow(px,py,18,p.h,.8);g.fillStyle=`hsl(${p.h},95%,85%)`;g.beginPath();g.arc(px,py,3,0,7);g.fill()}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>16.5)startPlay()},500);
setTimeout(startPlay,180);
})();
