<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#9d6bff;--mint:#4fe3ff;--vio:#8a7bff;--txt:#f1f1ff;--dim:#667090;

html,body{height:100%;background:#04050a;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#fit{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:540px;height:960px;transform-origin:center center;overflow:hidden;

.rev{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .65s cubic-bezier(.16,1,.3,1)}

#head{position:absolute;left:0;right:0;top:142px;text-align:center;z-index:6}
.kick{font:500 11px/1 var(--mono);letter-spacing:.26em;color:var(--dim)}

@media (prefers-reduced-motion:reduce){.aur{animation:none}}

(()=>{

/* ================= scene: the zero-knowledge cave ================= */
const MONO='"JetBrains Mono",ui-monospace,monospace',NC=[270,430],RR=105,VIO='157,107,255',CYN='79,227,255',GLD='255,207,74',PNK='255,138,216';

 S.seg.push({t0,t1:t0+din,a0:90,a1:top});S.seg.push({t0:ex,t1:ex+dout,a0:top,a1:end});

/* ================= render ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function pegAt(){let last=90;for(const s of S.seg){if(E<s.t0)break;if(E<=s.t1){const u=(E-s.t0)/(s.t1-s.t0),sm=u*u*(3-2*u);return{a:lerp(s.a0,s.a1,sm),m:true,d:Math.sign(s.a1-s.a0)}}last=s.a1}return{a:last,m:false,d:0}}
function drawCave(na){const wall=`rgba(34,22,70,${.95*na})`,pg=pegAt(),dd=((pg.a-90)%360+360)%360,inside=Math.min(dd,360-dd)>14;

 [-17,17].forEach(o=>{g.strokeStyle=`rgba(${VIO},${.75*na})`;g.lineWidth=1.6;g.beginPath();g.arc(NC[0],NC[1],RR+o,0,7);g.stroke()});
 g.fillStyle=wall;g.fillRect(253,536,34,38);g.strokeStyle=`rgba(${VIO},${.75*na})`;g.lineWidth=1.6;g.beginPath();g.moveTo(253,540);g.lineTo(253,574);g.moveTo(287,540);g.lineTo(287,574);g.stroke();
 g.setLineDash([2,6]);g.lineDashOffset=-E*8;g.strokeStyle=`rgba(${VIO},${.3*na})`;g.lineWidth=1;g.beginPath();g.arc(NC[0],NC[1],RR,0,7);g.stroke();g.setLineDash([]);
 for(let i=0;i<26;i++){const a=R(i,1,1)*360,r=RR+(R(i,2,2)-.5)*26,p=PT(a,r);if(Math.abs(p[1]-555)<20&&Math.abs(p[0]-270)<20)continue;glow(p[0],p[1],7,265+R(i,3,3)*40,(.25+.25*Math.sin(E*2+i))*na)}
 g.textAlign='center';g.fillStyle=`rgba(200,185,255,${(inside?.9:.35)*na})`;g.font=`700 8.5px ${MONO}`;g.fillText(inside?'VICTOR CANNOT':'WALLS BLOCK',NC[0],NC[1]-2);g.fillText(inside?'SEE INSIDE':'THE VIEW',NC[0],NC[1]+10);
 /* magic door */
 const D=PT(270),open=S.dop?Math.exp(-(E-S.dop)*1.6):0,sealed=1-clamp(open*1.4,0,1);
 glow(D[0],D[1],34,45,(.35+.5*open)*na);g.globalAlpha=na*(.25+.75*sealed);rr(D[0]-4,D[1]-19,8,38,3);g.fillStyle=`rgb(${GLD})`;g.fill();g.globalAlpha=1;
 g.fillStyle=`rgba(${GLD},${.9*na})`;g.font=`700 8.5px ${MONO}`;g.fillText('MAGIC DOOR',D[0],D[1]+36);
 /* victor */
 g.fillStyle=`rgba(${CYN},${.07*na})`;g.beginPath();g.moveTo(VIC[0],VIC[1]-8);g.lineTo(253,572);g.lineTo(287,572);g.closePath();g.fill();
 g.beginPath();g.arc(VIC[0],VIC[1],13,0,7);g.fillStyle='rgba(8,24,34,.95)';g.fill();g.strokeStyle=`rgba(${CYN},${.95*na})`;g.lineWidth=1.6;g.stroke();
 g.beginPath();g.ellipse(VIC[0],VIC[1],7,4,0,0,7);g.strokeStyle=`rgba(${CYN},${na})`;g.lineWidth=1.2;g.stroke();g.fillStyle=`rgb(${CYN})`;g.beginPath();g.arc(VIC[0],VIC[1],2,0,7);g.fill();
 g.fillStyle=`rgba(${CYN},${.9*na})`;g.font=`700 8.5px ${MONO}`;g.fillText('VICTOR',VIC[0],VIC[1]+26);
 /* victor shout */
 if(S.call){const t=E-S.call;if(t<1.3){const al=ease(t/.15)*(1-clamp((t-1)/.3)),L=S.cs==='L',bx=VIC[0]+(L?-78:78);
  pill(L?'← COME OUT LEFT!':'COME OUT RIGHT! →',bx,VIC[1]-4,`rgb(${CYN})`,al);
  g.strokeStyle=`rgba(${CYN},${al})`;g.lineWidth=4;g.lineCap='round';g.beginPath();g.arc(NC[0],NC[1],RR,ang90(L?90:90),ang90(L?90:90));g.lineCap='butt';
  const a0=L?90:90,a1=L?150:30;g.beginPath();g.arc(NC[0],NC[1],RR,a0*Math.PI/180,a1*Math.PI/180,!L);g.stroke()}}

  glow(p[0],p[1],26,320,.95*pa);g.globalCompositeOperation='source-over';g.fillStyle='#ffe6f7';g.beginPath();g.arc(p[0],p[1],5.5*pa,0,7);g.fill();
  const q=PT(pg.a,RR+(Math.abs(pg.a%360-90)<20||Math.abs(pg.a%360+270)<20?0:0)-19);g.fillStyle=`rgba(${PNK},${.95*pa})`;g.font=`700 8px ${MONO}`;if(PT(pg.a)[1]<540)g.fillText('PEGGY',q[0],q[1]+3);else g.fillText('PEGGY',p[0]+30,p[1]+3)}
 /* round pips */
 for(let i=0;i<5;i++){const px=270-48+i*24,done=S.passed>i;g.beginPath();g.arc(px,640,8,0,7);g.fillStyle=done?`rgba(${GLD},.9)`:'rgba(255,255,255,.06)';g.fill();g.strokeStyle=done?`rgb(${GLD})`:`rgba(${VIO},.5)`;g.lineWidth=1.3;g.stroke();
  g.fillStyle=done?'#2a1c00':'rgba(190,175,230,.6)';g.font=`800 8.5px ${MONO}`;g.fillText(done?'✓':i+1,px,643)}}
const ang90=a=>a*Math.PI/180;
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();

 g.globalCompositeOperation='source-over';
