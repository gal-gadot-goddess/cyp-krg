function tone(o={}){if(!ac||muted)return;const{type='sine',f=440,f2=null,dur=.12,vol=.15,at=0,atk=.008}=o,t0=o.abs!=null?o.abs:TN()+at;

 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}

 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+dur*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 n.connect(f);f.connect(gn);out(gn,o);n.start(t0);n.stop(t0+dur+.05)}

};

   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+3);
   const gn=ac.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.013,t+1.2);gn.gain.linearRampToValueAtTime(.0001,t+4.3);
   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));
  for(let b=0;b<2;b++)tone({abs:t+b*2,f:c[3],dur:1.9,vol:.1,atk:.04,bus:musBus,wet:0})});
 const AR=[440,523.25,659.25,784,659.25,523.25,440,392];
 for(let i=0;i<42;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20,0,1);if(t>t0+13.3)break;
  tone({abs:t,type:'triangle',f:AR[i%8]*(i%16>=8?2:1),dur:.3,vol:v,bus:musBus,pan:Math.sin(i)*.4,wet:.35})}
 for(let b=0;b<21;b++){const t=t0+3+b*B;tone({abs:t,f:135,f2:42,dur:.22,vol:.2,bus:musBus,wet:0});
  noise({abs:t+B/2,dur:.05,vol:.018,f0:9000,f1:7000,q:.8,ft:'highpass',bus:musBus,wet:0})}
 noise({abs:t0+13.4,dur:.85,vol:.16,f0:300,f1:7000,q:1.5,bus:musBus});
 tone({abs:t0+13.4,type:'sawtooth',f:200,f2:1600,dur:.85,vol:.04,bus:musBus})}

/* ================= scene: the merkle tree ================= */
const MONO='"JetBrains Mono",ui-monospace,monospace',GRN='39,245,176',RED='255,90,106',GLD='255,211,77';
const XA=[[],[],[],[]];for(let i=0;i<8;i++)XA[0][i]=97.75+47.5*i;for(let i=0;i<4;i++)XA[1][i]=(XA[0][2*i]+XA[0][2*i+1])/2;for(let i=0;i<2;i++)XA[2][i]=(XA[1][2*i]+XA[1][2*i+1])/2;XA[3][0]=(XA[2][0]+XA[2][1])/2;
const LY=[548,472,396,322],TXY=598,CNT=[8,4,2,1],P=(l,i)=>l<0?[XA[0][i],TXY]:[XA[l][i],LY[l]];
const CAP=['Hash every transaction, then hash pairs upward until one root remains','Prove TX 5 is in the block with 3 sibling hashes, not all 8 transactions','An attacker edits TX 6. Its hash changes, and so does every hash above it','The root no longer matches the block header. Block rejected'];
const SPR={};function spr(h){const k=Math.round(h/10)*10;if(!SPR[k]){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}

Object.assign(sfx,{
 pl(h){tone({f:NOTES[(h*2)%10]*1.5,dur:.25,vol:.07,pan:Math.sin(h)*.5,wet:.4})},
 blip(n){tone({f:NOTES[5+n%6],dur:.25,vol:.08,pan:.2,wet:.4});tone({type:'triangle',f:NOTES[5+n%6]*.5,dur:.25,vol:.06})},
 nope(){tone({type:'square',f:220,f2:110,dur:.14,vol:.06,wet:.1})},

 win(){[523,659,784,1046,1318].forEach((f,i)=>tone({type:'triangle',f,dur:.6,vol:.07,at:i*.07,wet:.4}));sfx.chord(.06)}});
let S,E=0,events=[],raf=null,lastF=0;
function fresh(){S={on:0,bt:[],hl:{},hlOff:0,tamp:0,eq:0,neq:0,rej:0,flash:-9,stat:{tx:'—',pf:'—',rt:'—',bad:0},sp:[],rg:[]}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}

 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});

 a(2.4,()=>{ph(0);$('#stats').classList.add('show');S.stat.tx='8';sfx.chord(.03)});
 [2.8,3.9,5.0,6.1].forEach((t,l)=>a(t,()=>{S.bt[l]=E;sfx.pl(l*2+1);sfx.whoosh(.5,.06);if(l===3){const p=P(3,0);ring(p[0],p[1],45);burst(p[0],p[1],45,18);sfx.found&&0;sfx.win();flt('MERKLE ROOT → block header',270,304,'#ffd34d')}}));
 a(7.0,()=>ph(1));
 a(7.1,()=>{S.hl['tx,4']={k:'path'};flt('is TX 5 in this block?',270,304,'#e8fff6')});
 [[7.7,'0,5'],[8.3,'1,3'],[8.9,'2,0']].forEach(([t,k],i)=>a(t,()=>{S.hl[k]={k:'sib'};sfx.blip(i);const [l,j]=k.split(',').map(Number),p=P(l,j);ring(p[0],p[1],150);if(i===2)S.stat.pf='3 hashes'}));
 [[9.0,'0,4'],[9.4,'1,2'],[9.8,'2,1']].forEach(([t,k],i)=>a(t,()=>{S.hl[k]={k:'path'};sfx.blip(i+3);const [l,j]=k.split(',').map(Number),p=P(l,j);ring(p[0],p[1],45)}));
 a(10.2,()=>{S.hl['3,0']={k:'path'};S.eq=E;S.stat.rt='MATCH ✓';sfx.win();const p=P(3,0);ring(p[0],p[1],150);burst(p[0],p[1],150,16);flt('root matches ✓ proof valid',270,304,'#27f5b0')});

 [11.1,11.6,12.1].forEach(t=>a(t,()=>sfx.nope()));

 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function rain(){g.font=`700 9px ${MONO}`;g.textAlign='center';
 for(let c=0;c<12;c++){const x=22+c*43,sp=18+R(c,3,3)*30;for(let r=0;r<16;r++){const y=((r*62+E*sp+R(c,r,1)*300)%1000)-20;
  g.fillStyle=`rgba(120,255,200,${.035+.05*R(c,r,5)})`;g.fillText('0123456789abcdef'[Math.floor(R(c,r,2)*16+E*1.5)%16],x,y)}}}
function pill(t,x,y,col,al=1){g.font=`700 9px ${MONO}`;g.textAlign='center';const w=g.measureText(t).width+14;g.globalAlpha=al;rr(x-w/2,y-8,w,16,8);g.fillStyle='rgba(6,16,18,.92)';g.fill();g.strokeStyle=col;g.lineWidth=1.2;g.stroke();g.fillStyle=col;g.fillText(t,x,y+3);g.globalAlpha=1}
function hstr(l,i){const t=tm(l,i),v=t?1:0,tt=S.tamp+.3+.5*l;
 if(E-ap(l,i)<.6||(t&&E-tt<.4)){const q=Math.floor(E*20);return[0,1,2,3].map(k=>'0123456789abcdef'[Math.floor(R(l*13+i,k+q*3,9)*16)]).join('')}
 if(l===3)return v?'7c1e':'a3f9';return[0,1,2,3].map(k=>'0123456789abcdef'[Math.floor(R(l*13+i,k+v*7,5)*16)]).join('')}
function drawTree(na){
 const hf=S.hlOff?1-ease((E-S.hlOff)/.5):1;
 for(let l=1;l<4;l++)for(let i=0;i<CNT[l];i++){const pa=ap(l,i);if(E<pa)continue;const pp=P(l,i);
  for(let c=0;c<2;c++){const ci=2*i+c,cp=P(l-1,ci),red=tm(l,i)&&tm(l-1,ci);
   g.strokeStyle=red?`rgba(${RED},${.8*na})`:`rgba(${GRN},${.3*na})`;g.lineWidth=red?1.8:1.2;g.beginPath();g.moveTo(cp[0],cp[1]-10);g.lineTo(pp[0],pp[1]+(l===3?13:10));g.stroke();
   const u=(E-pa)/.5;if(u>0&&u<1){g.globalCompositeOperation='lighter';glow(lerp(cp[0],pp[0],u),lerp(cp[1],pp[1],u),11,150,.9);g.globalCompositeOperation='source-over'}}}
 for(let i=0;i<8;i++){const a=ease((E-(S.on+.2+i*.07))/.35)*na;if(a<=0)continue;const p=P(-1,i),h0=ap(0,i);
  if(E>h0){g.strokeStyle=`rgba(${GRN},${.25*a})`;g.lineWidth=1.2;g.beginPath();g.moveTo(p[0],p[1]-11);g.lineTo(p[0],LY[0]+10);g.stroke()}
  const bad=i===5&&S.tamp&&E>S.tamp,h=S.hl['tx,'+i];g.globalAlpha=a;rr(p[0]-20,p[1]-11,40,22,6);g.fillStyle=bad?`rgba(${RED},.22)`:'rgba(14,34,40,.95)';g.fill();
  const hv0=h&&hf>.05;g.strokeStyle=bad?`rgb(${RED})`:hv0?`rgba(${GLD},${hf})`:`rgba(${GRN},.55)`;g.lineWidth=hv0?2:1.2;g.stroke();g.fillStyle=bad?'#ff9aa6':'#d8fff0';g.font=`700 9px ${MONO}`;g.textAlign='center';g.fillText('TX'+(i+1),p[0],p[1]+3);g.globalAlpha=1}
 for(let l=0;l<4;l++)for(let i=0;i<CNT[l];i++){const a=ease((E-ap(l,i))/.35)*na;if(a<=0)continue;const p=P(l,i),t=tm(l,i),h=S.hl[l+','+i],hv=h?hf:0,rt=l===3,w=rt?58:40,hh=rt?26:20;
  if(hv>.05)glow(p[0],p[1],rt?44:32,h.k==='sib'?150:45,.6*hv*a);
  g.globalAlpha=a;rr(p[0]-w/2,p[1]-hh/2,w,hh,6);g.fillStyle=t?`rgba(${RED},.2)`:rt?`rgba(${GLD},.16)`:'rgba(8,30,28,.92)';g.fill();
  g.strokeStyle=t?`rgb(${RED})`:hv>.05?(h.k==='sib'?`rgba(${GRN},1)`:`rgba(${GLD},1)`):rt?`rgba(${GLD},.9)`:`rgba(${GRN},.7)`;g.lineWidth=hv>.05||t||rt?2:1.3;g.stroke();
  g.fillStyle=t?'#ff9aa6':rt?'#ffe9a8':'#bffff0';g.font=`700 ${rt?11:9}px ${MONO}`;g.textAlign='center';g.fillText(hstr(l,i),p[0],p[1]+3);g.globalAlpha=1;
  if(hv>.05&&h.k==='sib'&&l<3)pill('PROOF',p[0],p[1]+(l===0?24:-22),`rgba(${GRN},${hv})`,hv)}
 if(S.tamp&&E>S.tamp){const al=ease((E-S.tamp)/.3);pill('5 BTC → 50 BTC',XA[0][5]+8,573,`rgb(${RED})`,al)}
 if(ap(3,0)<E){const r=ease((E-ap(3,0)-.2)/.4)*na,p=P(3,0);g.fillStyle=`rgba(${GLD},${.8*r})`;g.font=`700 8px ${MONO}`;g.textAlign='center';g.fillText('MERKLE ROOT',p[0],p[1]-19);
  g.setLineDash([3,4]);g.lineDashOffset=-E*10;g.strokeStyle=S.neq?`rgba(${RED},${r})`:`rgba(${GLD},${.6*r})`;g.lineWidth=1.2;g.beginPath();g.moveTo(p[0]+29,p[1]);g.lineTo(346,p[1]);g.stroke();g.setLineDash([]);
  g.globalAlpha=r;rr(346,p[1]-16,100,32,7);g.fillStyle='rgba(30,26,8,.9)';g.fill();g.strokeStyle=S.neq?`rgba(${RED},.6)`:`rgba(${GLD},.8)`;g.lineWidth=1.3;g.stroke();
  g.fillStyle='#9a9468';g.font=`700 7.5px ${MONO}`;g.fillText('BLOCK HEADER',396,p[1]-4);g.fillStyle='#ffd34d';g.font=`700 10px ${MONO}`;g.fillText('root a3f9',396,p[1]+9);g.globalAlpha=1;
  if(S.eq||S.neq){g.font=`800 18px ${MONO}`;g.fillStyle=S.neq?`rgb(${RED})`:`rgb(${GRN})`;g.fillText(S.neq?'≠':'=',318,p[1]+7)}}
 if(S.rej){const a=ease((E-S.rej)/.25),k=1+(1-a)*.5;g.save();g.translate(270,452);g.rotate(-.2);g.scale(k,k);g.globalAlpha=a;g.fillStyle=`rgba(${RED},.12)`;rr(-130,-26,260,52,6);g.fill();g.strokeStyle=`rgb(${RED})`;g.lineWidth=3;g.stroke();
  g.fillStyle=`rgb(${RED})`;g.shadowColor=`rgb(${RED})`;g.shadowBlur=18;g.font=`800 24px ${MONO}`;g.textAlign='center';g.fillText('BLOCK REJECTED',0,9);g.restore();g.globalAlpha=1}}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 if(S.rej&&E-S.rej<.4)g.translate((Math.random()-.5)*5,(Math.random()-.5)*5);
 rain();if(S.on)drawTree(ease((E-S.on)/.8));
 const a=[S.stat.tx,S.stat.pf,S.stat.rt];['sl','sp','sb'].forEach((id,i)=>{const el=$('#'+id);if(el.textContent!==a[i])el.textContent=a[i]});$('#sb').className=S.stat.bad?'bad':'';
 g.globalCompositeOperation='lighter';
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const al=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,al)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const al=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-al})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+al*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);

$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};

addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});

if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>16.5)startPlay()},500);
